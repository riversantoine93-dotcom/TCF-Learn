<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-label="A prompt card leads to an AI draft marked unverified, then to an independent-source review and a human decision card."><title>Draft, verify, then decide</title><desc>A prompt card leads to an AI draft marked unverified, then to an independent-source review and a human decision card.</desc><metadata>Original TCF educational illustration. CC0-1.0: https://creativecommons.org/publicdomain/zero/1.0/</metadata><rect width="960" height="540" rx="22" fill="#f3efe5"/><text x="43" y="45" fill="#715a32" font-family="Arial,Helvetica,sans-serif" font-size="15">SCENARIO ILLUSTRATION</text><text x="43" y="91" fill="#25313b" font-family="Arial,Helvetica,sans-serif" font-size="30">Draft, verify, then decide</text><rect x="55" y="163" width="225" height="235" rx="12" fill="#fffdf8" stroke="#25313b" stroke-width="3"/><text x="75" y="198" fill="#25313b" font-family="Arial,Helvetica,sans-serif" font-size="21">Input</text><text x="75" y="235" fill="#25313b" font-family="Arial,Helvetica,sans-serif" font-size="18">Task</text><text x="75" y="265" fill="#25313b" font-family="Arial,Helvetica,sans-serif" font-size="18">Allowed facts</text><text x="75" y="295" fill="#25313b" font-family="Arial,Helvetica,sans-serif" font-size="18">Constraints</text><path d="M297 273L340 273" fill="none" stroke="#b18b43" stroke-width="4" stroke-linecap="round"/><path d="M329.4690092573155 278.75310646325045L340 273L329.4690092573155 267.24689353674955" fill="none" stroke="#b18b43" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><rect x="355" y="163" width="246" height="235" rx="12" fill="#fffdf8" stroke="#25313b" stroke-width="3"/><text x="375" y="198" fill="#25313b" font-family="Arial,Helvetica,sans-serif" font-size="21">AI draft</text><text x="375" y="235" fill="#25313b" font-family="Arial,Helvetica,sans-serif" font-size="18">UNVERIFIED</text><text x="375" y="265" fill="#25313b" font-family="Arial,Helvetica,sans-serif" font-size="18">Review every claim</text><text x="375" y="295" fill="#25313b" font-family="Arial,Helvetica,sans-serif" font-size="18">Keep private data out</text><path d="M615 273L657 273" fill="none" stroke="#b18b43" stroke-width="4" stroke-linecap="round"/><path d="M646.4690092573155 278.75310646325045L657 273L646.4690092573155 267.24689353674955" fill="none" stroke="#b18b43" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><rect x="672" y="163" width="236" height="235" rx="12" fill="#fffdf8" stroke="#25313b" stroke-width="3"/><text x="692" y="198" fill="#25313b" font-family="Arial,Helvetica,sans-serif" font-size="21">Human review</text><text x="692" y="235" fill="#25313b" font-family="Arial,Helvetica,sans-serif" font-size="18">Independent sources</text><text x="692" y="265" fill="#25313b" font-family="Arial,Helvetica,sans-serif" font-size="18">Applicable criteria</text><text x="692" y="295" fill="#25313b" font-family="Arial,Helvetica,sans-serif" font-size="18">Approved decision</text><text x="171" y="459" fill="#25313b" font-family="Arial,Helvetica,sans-serif" font-size="25">A plausible draft is not evidence by itself.</text><text x="43" y="520" fill="#5b666a" font-family="Arial,Helvetica,sans-serif" font-size="15">Original illustration · CC0 · conceptual, not to scale</text></svg>
