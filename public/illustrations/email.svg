<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-label="A fictional email layout has labeled recipient, subject, request, attachment, and send-check areas."><title>A clear message and recipient check</title><desc>A fictional email layout has labeled recipient, subject, request, attachment, and send-check areas.</desc><metadata>Original TCF educational illustration. CC0-1.0: https://creativecommons.org/publicdomain/zero/1.0/</metadata><rect width="960" height="540" rx="22" fill="#f3efe5"/><text x="43" y="45" fill="#715a32" font-family="Arial,Helvetica,sans-serif" font-size="15">SCENARIO ILLUSTRATION</text><text x="43" y="91" fill="#25313b" font-family="Arial,Helvetica,sans-serif" font-size="30">A clear message and recipient check</text><rect x="92" y="136" width="776" height="309" rx="12" fill="#fffdf8" stroke="#25313b" stroke-width="3"/><rect x="92" y="136" width="776" height="46" rx="12" fill="#d9e5e4" stroke="#25313b" stroke-width="3"/><text x="118" y="167" fill="#25313b" font-family="Arial,Helvetica,sans-serif" font-size="21">A fictional message</text><text x="122" y="218" fill="#25313b" font-family="Arial,Helvetica,sans-serif" font-size="21">To:</text><path d="M219 214L820 214" fill="none" stroke="#adbbbd" stroke-width="4" stroke-linecap="round"/><text x="122" y="263" fill="#25313b" font-family="Arial,Helvetica,sans-serif" font-size="21">Subject:</text><path d="M219 259L820 259" fill="none" stroke="#adbbbd" stroke-width="4" stroke-linecap="round"/><rect x="124" y="286" width="691" height="84" rx="12" fill="#f5f2e9" stroke="#d0d6d5" stroke-width="3"/><text x="145" y="320" fill="#25313b" font-family="Arial,Helvetica,sans-serif" font-size="21">Purpose → necessary context → one clear request</text><text x="145" y="350" fill="#25313b" font-family="Arial,Helvetica,sans-serif" font-size="18">Use only accurate, appropriate information.</text><text x="126" y="412" fill="#25313b" font-family="Arial,Helvetica,sans-serif" font-size="19">Attachment</text><rect x="664" y="385" width="149" height="41" rx="12" fill="#b18b43" stroke="#25313b" stroke-width="3"/><text x="688" y="414" fill="#25313b" font-family="Arial,Helvetica,sans-serif" font-size="19">Send check</text><text x="43" y="520" fill="#5b666a" font-family="Arial,Helvetica,sans-serif" font-size="15">Original illustration · CC0 · conceptual, not to scale</text></svg>
