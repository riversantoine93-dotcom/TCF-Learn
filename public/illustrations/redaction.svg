<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-label="A fictional support screen shows an error message while unrelated record fields are covered by solid redaction bars."><title>Share the relevant issue, protect the rest</title><desc>A fictional support screen shows an error message while unrelated record fields are covered by solid redaction bars.</desc><metadata>Original TCF educational illustration. CC0-1.0: https://creativecommons.org/publicdomain/zero/1.0/</metadata><rect width="960" height="540" rx="22" fill="#f3efe5"/><text x="43" y="45" fill="#715a32" font-family="Arial,Helvetica,sans-serif" font-size="15">SCENARIO ILLUSTRATION</text><text x="43" y="91" fill="#25313b" font-family="Arial,Helvetica,sans-serif" font-size="30">Share the relevant issue, protect the rest</text><rect x="119" y="134" width="722" height="323" rx="12" fill="#fffdf8" stroke="#25313b" stroke-width="3"/><rect x="119" y="134" width="722" height="51" rx="12" fill="#d9e5df" stroke="#25313b" stroke-width="3"/><text x="143" y="169" fill="#25313b" font-family="Arial,Helvetica,sans-serif" font-size="24">Fictional support screen</text><rect x="145" y="205" width="669" height="72" rx="12" fill="#e9d4b9" stroke="#25313b" stroke-width="3"/><text x="165" y="250" fill="#25313b" font-family="Arial,Helvetica,sans-serif" font-size="24">Relevant error: upload could not complete</text><text x="147" y="320" fill="#25313b" font-family="Arial,Helvetica,sans-serif" font-size="22">Unrelated record</text><rect x="404" y="293" width="365" height="29" rx="2" fill="#25313b" stroke="#25313b" stroke-width="3"/><text x="147" y="371" fill="#25313b" font-family="Arial,Helvetica,sans-serif" font-size="22">Private field</text><rect x="404" y="344" width="365" height="29" rx="2" fill="#25313b" stroke="#25313b" stroke-width="3"/><text x="147" y="422" fill="#25313b" font-family="Arial,Helvetica,sans-serif" font-size="22">Private field</text><rect x="404" y="395" width="365" height="29" rx="2" fill="#25313b" stroke="#25313b" stroke-width="3"/><text x="146" y="487" fill="#25313b" font-family="Arial,Helvetica,sans-serif" font-size="22">Use approved redaction, then verify the exported copy.</text><text x="43" y="520" fill="#5b666a" font-family="Arial,Helvetica,sans-serif" font-size="15">Original illustration · CC0 · conceptual, not to scale</text></svg>
