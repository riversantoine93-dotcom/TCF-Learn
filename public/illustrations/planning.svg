<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-label="A task notebook connects a chosen cue, one next action, and a review point, with room for a revised plan."><title>One manageable plan</title><desc>A task notebook connects a chosen cue, one next action, and a review point, with room for a revised plan.</desc><metadata>Original TCF educational illustration. CC0-1.0: https://creativecommons.org/publicdomain/zero/1.0/</metadata><rect width="960" height="540" rx="22" fill="#f3efe5"/><text x="43" y="45" fill="#715a32" font-family="Arial,Helvetica,sans-serif" font-size="15">SCENARIO ILLUSTRATION</text><text x="43" y="91" fill="#25313b" font-family="Arial,Helvetica,sans-serif" font-size="30">One manageable plan</text><rect x="80" y="145" width="266" height="299" rx="12" fill="#fffdf8" stroke="#25313b" stroke-width="3"/><text x="100" y="182" fill="#25313b" font-family="Arial,Helvetica,sans-serif" font-size="21">Your chosen goal</text><path d="M102 217L324 217" fill="none" stroke="#b0b6b7" stroke-width="5" stroke-linecap="round"/><path d="M102 249L279 249" fill="none" stroke="#b0b6b7" stroke-width="5" stroke-linecap="round"/><path d="M102 281L324 281" fill="none" stroke="#b0b6b7" stroke-width="5" stroke-linecap="round"/><path d="M102 313L279 313" fill="none" stroke="#b0b6b7" stroke-width="5" stroke-linecap="round"/><rect x="430" y="142" width="447" height="83" rx="12" fill="#fffdf8" stroke="#25313b" stroke-width="3"/><text x="450" y="177" fill="#25313b" font-family="Arial,Helvetica,sans-serif" font-size="21">Cue: a familiar moment</text><rect x="430" y="247" width="447" height="83" rx="12" fill="#fffdf8" stroke="#25313b" stroke-width="3"/><text x="450" y="282" fill="#25313b" font-family="Arial,Helvetica,sans-serif" font-size="21">Action: one manageable step</text><rect x="430" y="352" width="447" height="83" rx="12" fill="#fffdf8" stroke="#25313b" stroke-width="3"/><text x="450" y="387" fill="#25313b" font-family="Arial,Helvetica,sans-serif" font-size="21">Review: what happened?</text><path d="M650 230L650 241" fill="none" stroke="#b18b43" stroke-width="4" stroke-linecap="round"/><path d="M644.2468935367496 230.46900925731552L650 241L655.7531064632504 230.46900925731552" fill="none" stroke="#b18b43" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M650 335L650 346" fill="none" stroke="#b18b43" stroke-width="4" stroke-linecap="round"/><path d="M644.2468935367496 335.4690092573155L650 346L655.7531064632504 335.4690092573155" fill="none" stroke="#b18b43" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="96" y="483" fill="#25313b" font-family="Arial,Helvetica,sans-serif" font-size="23">A plan can be revised when conditions change.</text><text x="43" y="520" fill="#5b666a" font-family="Arial,Helvetica,sans-serif" font-size="15">Original illustration · CC0 · conceptual, not to scale</text></svg>
