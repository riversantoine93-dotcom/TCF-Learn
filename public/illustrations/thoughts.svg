<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-label="Three separate cards distinguish an observed event, a thought about it, and a possible next action."><title>Event, interpretation, and choice</title><desc>Three separate cards distinguish an observed event, a thought about it, and a possible next action.</desc><metadata>Original TCF educational illustration. CC0-1.0: https://creativecommons.org/publicdomain/zero/1.0/</metadata><rect width="960" height="540" rx="22" fill="#f3efe5"/><text x="43" y="45" fill="#715a32" font-family="Arial,Helvetica,sans-serif" font-size="15">SCENARIO ILLUSTRATION</text><text x="43" y="91" fill="#25313b" font-family="Arial,Helvetica,sans-serif" font-size="30">Event, interpretation, and choice</text><rect x="51" y="163" width="262" height="253" rx="12" fill="#fffdf8" stroke="#25313b" stroke-width="3"/><text x="71" y="198" fill="#25313b" font-family="Arial,Helvetica,sans-serif" font-size="21">Observed event</text><text x="71" y="235" fill="#25313b" font-family="Arial,Helvetica,sans-serif" font-size="18">What is known?</text><text x="71" y="265" fill="#25313b" font-family="Arial,Helvetica,sans-serif" font-size="18">Separate the facts.</text><path d="M326 287L350 287" fill="none" stroke="#b18b43" stroke-width="4" stroke-linecap="round"/><path d="M339.4690092573155 292.75310646325045L350 287L339.4690092573155 281.24689353674955" fill="none" stroke="#b18b43" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><rect x="365" y="163" width="259" height="253" rx="12" fill="#fffdf8" stroke="#25313b" stroke-width="3"/><text x="385" y="198" fill="#25313b" font-family="Arial,Helvetica,sans-serif" font-size="21">Interpretation</text><text x="385" y="235" fill="#25313b" font-family="Arial,Helvetica,sans-serif" font-size="18">What am I assuming?</text><text x="385" y="265" fill="#25313b" font-family="Arial,Helvetica,sans-serif" font-size="18">What supports it?</text><path d="M636 287L660 287" fill="none" stroke="#b18b43" stroke-width="4" stroke-linecap="round"/><path d="M649.4690092573155 292.75310646325045L660 287L649.4690092573155 281.24689353674955" fill="none" stroke="#b18b43" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><rect x="675" y="163" width="235" height="253" rx="12" fill="#fffdf8" stroke="#25313b" stroke-width="3"/><text x="695" y="198" fill="#25313b" font-family="Arial,Helvetica,sans-serif" font-size="21">Next choice</text><text x="695" y="235" fill="#25313b" font-family="Arial,Helvetica,sans-serif" font-size="18">What can I check?</text><text x="695" y="265" fill="#25313b" font-family="Arial,Helvetica,sans-serif" font-size="18">What can I do?</text><text x="195" y="470" fill="#25313b" font-family="Arial,Helvetica,sans-serif" font-size="23">An interpretation is not automatically a fact.</text><text x="43" y="520" fill="#5b666a" font-family="Arial,Helvetica,sans-serif" font-size="15">Original illustration · CC0 · conceptual, not to scale</text></svg>
