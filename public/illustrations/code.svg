<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-label="A fictional code window separates an input value, a short function, an output area, and three test-case cards."><title>Inputs, logic, and results</title><desc>A fictional code window separates an input value, a short function, an output area, and three test-case cards.</desc><metadata>Original TCF educational illustration. CC0-1.0: https://creativecommons.org/publicdomain/zero/1.0/</metadata><rect width="960" height="540" rx="22" fill="#f3efe5"/><text x="43" y="45" fill="#715a32" font-family="Arial,Helvetica,sans-serif" font-size="15">SCENARIO ILLUSTRATION</text><text x="43" y="91" fill="#25313b" font-family="Arial,Helvetica,sans-serif" font-size="30">Inputs, logic, and results</text><rect x="58" y="147" width="579" height="296" rx="12" fill="#24343d" stroke="#25313b" stroke-width="3"/><text x="84" y="184" fill="#e6d6ae" font-family="Arial,Helvetica,sans-serif" font-size="19">FICTIONAL CODE / SAFE PRACTICE</text><text x="86" y="240" fill="#e8eee9" font-family="Arial,Helvetica,sans-serif" font-size="27">input → function → result</text><text x="86" y="293" fill="#c1d9d7" font-family="Arial,Helvetica,sans-serif" font-size="22">Check types and assumptions.</text><text x="86" y="338" fill="#c1d9d7" font-family="Arial,Helvetica,sans-serif" font-size="22">Compare expected and actual.</text><rect x="689" y="151" width="220" height="90" rx="12" fill="#fffdf8" stroke="#25313b" stroke-width="3"/><text x="709" y="186" fill="#25313b" font-family="Arial,Helvetica,sans-serif" font-size="21">Normal case</text><rect x="689" y="260" width="220" height="90" rx="12" fill="#fffdf8" stroke="#25313b" stroke-width="3"/><text x="709" y="295" fill="#25313b" font-family="Arial,Helvetica,sans-serif" font-size="21">Boundary case</text><rect x="689" y="369" width="220" height="90" rx="12" fill="#fffdf8" stroke="#25313b" stroke-width="3"/><text x="709" y="404" fill="#25313b" font-family="